services:
  - type: web
    name: one-percent-club-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_MODEL
        value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - key: AI_QUESTION_DAILY_LIMIT
        value: "5"
      - key: AI_QUESTION_GLOBAL_DAILY_LIMIT
        value: "200"
      - key: AI_QUESTION_GLOBAL_MINUTE_LIMIT
        value: "10"
      - key: AI_QUESTION_MAX_CONCURRENT
        value: "2"
      - key: AI_QUESTION_MAX_OUTPUT_TOKENS
        value: "500"
